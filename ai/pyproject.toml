[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zosh-bazaar-ai"
version = "1.0.0"
description = "Dedicated AI/ML and Recommendation Platform for Zosh Bazaar Multi-Vendor Marketplace"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rahul Raj Modi" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "pymongo>=4.8.0",
    "redis>=5.0.8",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends/Query in function arguments
    "E501",    # Line length handled gracefully
]

[tool.pyright]
include = ["."]
extraPaths = ["..", "."]
venvPath = "."
venv = ".venv"



