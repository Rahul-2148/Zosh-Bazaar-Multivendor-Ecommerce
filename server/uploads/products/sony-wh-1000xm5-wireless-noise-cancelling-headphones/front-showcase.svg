<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="400" cy="380" r="300" fill="url(#glow)" />

  <!-- Geometric Frame -->
  <rect x="120" y="100" width="560" height="560" rx="40" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Brand Watermark / Grid Lines -->
  <circle cx="400" cy="380" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="400" cy="380" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Center Badge / Emblem -->
  <circle cx="400" cy="380" r="85" fill="#38bdf8" opacity="0.15"/>
  <circle cx="400" cy="380" r="70" fill="url(#bg)" stroke="#38bdf8" stroke-width="3"/>
  <text x="400" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">SONY</text>

  <!-- Product Title & Details -->
  <text x="400" y="550" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Sony WH-1000XM5 Wireless Noise Cancelling Headphones</text>
  <text x="400" y="590" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="3">FRONT SHOWCASE</text>
  
  <!-- Verified Authentic Badge -->
  <rect x="290" y="625" width="220" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="312" cy="642" r="6" fill="#10b981"/>
  <text x="328" y="647" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ZOSH VERIFIED 100%</text>

  <!-- Decorative Accent Dots -->
  <circle cx="150" cy="130" r="4" fill="#38bdf8"/>
  <circle cx="650" cy="130" r="4" fill="#38bdf8"/>
  <circle cx="150" cy="630" r="4" fill="#38bdf8"/>
  <circle cx="650" cy="630" r="4" fill="#38bdf8"/>
</svg>